# Minimal rsyslog for the SSH target container.
# imuxsock provides /dev/log so sshd's syslog() calls are captured. imklog is
# intentionally omitted — a container can't read the kernel log ring buffer.
module(load="imuxsock")

global(workDirectory="/var/spool/rsyslog")

# sshd auth events -> the shared file Vector tails.
auth,authpriv.*  action(type="omfile" file="/var/log/ssh-target/auth.log" fileCreateMode="0644")

# Everything else -> a combined file, handy when debugging the container itself.
*.*;auth,authpriv.none  action(type="omfile" file="/var/log/ssh-target/container.log" fileCreateMode="0644")
