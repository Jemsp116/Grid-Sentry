# vector.toml
# Log shipper config: tails SSH auth logs and forwards parsed events into
# OpenSearch. Extend with additional [sources.*] blocks for nginx/apache
# access logs, firewall logs, etc.
#
# In the Docker demo (TICKET-003) this tails the auth log of the bundled
# `ssh-target` container via a shared volume, so a Hydra brute-force run
# produces real "Failed password" lines here.

[sources.ssh_auth]
type = "file"
include = ["/var/log/ssh-target/auth.log"]
read_from = "beginning"

[transforms.parse_ssh_auth]
type = "remap"
inputs = ["ssh_auth"]
source = '''
. = parse_syslog!(.message)
.log_source = "ssh_auth"
.event_type = "auth"
# Extract source IP from a typical "Failed password ... from <ip> port" line
ip_match = parse_regex(.message, r'from (?P<ip>\d+\.\d+\.\d+\.\d+)') ?? {}
.source_ip = ip_match.ip
.raw_message = .message
'''

[sinks.opensearch]
type = "elasticsearch"
inputs = ["parse_ssh_auth"]
endpoints = ["http://opensearch:9200"]
index = "soc-logs-%Y.%m.%d"
mode = "bulk"
api_version = "v8"
