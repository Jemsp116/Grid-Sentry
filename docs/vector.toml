# vector.toml
# Sample log shipper config: tails SSH auth logs and forwards parsed
# events into OpenSearch. Extend with additional [sources.*] blocks
# for nginx/apache access logs, firewall logs, etc.

[sources.ssh_auth]
type = "file"
include = ["/var/log/auth.log"]
read_from = "end"

[transforms.parse_ssh_auth]
type = "remap"
inputs = ["ssh_auth"]
source = '''
. = parse_syslog!(.message)
.log_source = "ssh_auth"
.event_type = "auth"
# Extract source IP from a typical "Failed password ... from <ip> port" line
ip_match = parse_regex(.message, r'from (?P<ip>\d+\.\d+\.\d+\.\d+)') ?? {}
.source_ip = ip_match.ip
.raw_message = .message
'''

[sinks.opensearch]
type = "elasticsearch"
inputs = ["parse_ssh_auth"]
endpoints = ["http://opensearch:9200"]
index = "soc-logs-%Y.%m.%d"
mode = "bulk"
