services:
  mongodb:
    image: mongo:7.0
    container_name: soc_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: soc_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # OpenSearch 2.12+ runs a demo-config installer that hard-fails unless
      # OPENSEARCH_INITIAL_ADMIN_PASSWORD is set. For the local demo we turn
      # security off entirely, which requires BOTH of these entrypoint switches
      # (the runtime `plugins.security.disabled` setting alone does NOT skip the
      # installer). Do not use in production.
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: soc_backend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "4000:4000"
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  worker:
    build: ./worker
    container_name: soc_worker
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: soc_frontend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ── Log ingestion (TICKET-003: Vector → OpenSearch) ───────────────────────────
  ssh-target:
    build: ./ingestion/ssh-target
    container_name: soc_ssh_target
    restart: unless-stopped
    volumes:
      - ssh_auth_logs:/var/log/ssh-target

  # ── OpenSearch Template Bootstrap ──────────────────────────────────────────
  opensearch-template:
    image: curlimages/curl:latest
    container_name: soc_opensearch_template
    depends_on:
      opensearch:
        condition: service_healthy
    entrypoint: >
      sh -c "
      echo 'Applying OpenSearch template for log indices...'
      curl -X PUT http://opensearch:9200/_index_template/soc-logs-template
        -H 'Content-Type: application/json'
        -d @/config/soc-logs-template.json
        && echo '' && echo 'Template applied successfully.' || echo 'Template application failed.'
      "
    volumes:
      - ./ingestion/opensearch/soc-logs-template.json:/config/soc-logs-template.json:ro

  # ── Attacker (on-demand brute-force traffic generator) ─────────────────────
  # Run with: docker compose --profile attack up attacker
  attacker:
    build: ./ingestion/attacker
    container_name: soc_attacker
    profiles: ["attack"]
    depends_on:
      - ssh-target
    environment:
      TARGET_HOST: ssh-target
      TARGET_USER: sentry
      REAL_PASSWORD: password123

volumes:
  mongodb_data:
  opensearch_data:
  ssh_auth_logs:
