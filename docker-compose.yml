services:
  postgres:
    image: postgres:16-alpine
    container_name: soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-soc_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations in db/migrations run automatically on FIRST container start,
      # in filename order (001_init.sql, 002_*.sql, ...).
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin} -d ${POSTGRES_DB:-soc_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: soc_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: soc_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  worker:
    build: ./worker
    container_name: soc_worker
    restart: unless-stopped
    env_file:
      - ./worker/.env
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: soc_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ── Log ingestion (wired up in TICKET-003) ──────────────────────────
  # Uncomment together once TICKET-003 is built. `ssh-target` is a real
  # OpenSSH server whose auth log Vector tails; run Hydra against it to
  # generate genuine brute-force logs for the detection demo.
  #
  # ssh-target:
  #   build: ./ingestion/ssh-target
  #   container_name: soc_ssh_target
  #   volumes:
  #     - ssh_auth_logs:/var/log/ssh-target
  #
  # vector:
  #   image: timberio/vector:0.40.0-debian
  #   container_name: soc_vector
  #   depends_on:
  #     opensearch:
  #       condition: service_healthy
  #   volumes:
  #     - ./ingestion/vector.toml:/etc/vector/vector.toml:ro
  #     - ssh_auth_logs:/var/log/ssh-target:ro

volumes:
  postgres_data:
  opensearch_data:
  # ssh_auth_logs:
